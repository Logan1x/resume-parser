[project]
name = "resume-parser"
version = "0.1.0"
description = "Read two-column resume PDFs down each column"
authors = [
    { name = "logan1x", email = "sharmakhushal78@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.8",
    "pdfminer.six>=20231228",
]

[project.scripts]
resume-parser = "resume_parser:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
